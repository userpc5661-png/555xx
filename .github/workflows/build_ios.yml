name: Build Mobile Apps

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  verify:
    name: Verify Flutter project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run tests
        run: flutter test

  build-android:
    name: Build Android App (.apk)
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # One APK per CPU type instead of one APK carrying all of them: each
      # is much smaller. Debug symbols are kept out of the app.
      - name: Build release APKs (per CPU, smaller)
        run: |
          flutter build apk --release --split-per-abi \
            --split-debug-info=build/app/outputs/symbols

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: SLSDriverNext_Android_APK
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          if-no-files-found: error
          retention-days: 14

  build-ios:
    name: Build iOS App (.ipa)
    needs: verify
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'
          cache: true

      - name: Enable Swift Package Manager
        run: flutter config --enable-swift-package-manager

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS Application (No CodeSign)
        run: |
          flutter build ios --release --no-codesign \
            --split-debug-info=build/ios-symbols

      - name: Package .ipa File
        run: |
          mkdir -p build-output/Payload
          cp -r build/ios/iphoneos/Runner.app build-output/Payload/
          cd build-output
          zip -r SLSDriverNext_iOS.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SLSDriverNext_iOS_IPA
          path: build-output/SLSDriverNext_iOS.ipa
          if-no-files-found: error
          retention-days: 14
